name: Paper trading bot

on:
  schedule:
    - cron: "*/30 * * * *"        # every 30 minutes (GitHub can run a few minutes late)
  workflow_dispatch:              # "Run workflow" button for manual runs
    inputs:
      extra:
        description: "Extra report to send now"
        type: choice
        options: [none, summary, gems, both]
        default: none
      reset:
        description: "Start over with a fresh 100 EUR"
        type: boolean
        default: false

permissions:
  contents: write                 # lets the bot save its portfolio back into the repo

concurrency:
  group: paper-bot                # never run two copies at once
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run the bot
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          ARGS=""
          if [ "${{ inputs.reset }}" = "true" ]; then ARGS="$ARGS --reset"; fi
          case "${{ inputs.extra }}" in
            summary) ARGS="$ARGS --summary" ;;
            gems)    ARGS="$ARGS --gems" ;;
            both)    ARGS="$ARGS --summary --gems" ;;
          esac
          python run.py $ARGS

      - name: Save portfolio, journal and reports
        if: always()
        run: |
          git config user.name "paper-bot"
          git config user.email "paper-bot@users.noreply.github.com"
          for d in state reports outbox docs; do if [ -e "$d" ]; then git add -A "$d"; fi; done
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "bot run $(date -u +'%Y-%m-%d %H:%M') UTC" -q
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
