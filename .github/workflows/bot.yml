name: Paper trading bot

# GitHub's own schedule is unreliable for new repos (it can skip hours).
# So each job stays alive ~5.5 hours, runs the bot every 30 minutes,
# saves after every run, then starts the next job itself.
# The cron below is only a backup in case the chain ever breaks.

on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:
    inputs:
      extra:
        description: "Extra report to send now"
        type: choice
        options: [none, summary, gems, both]
        default: none
      reset:
        description: "Start over with a fresh 100 EUR"
        type: boolean
        default: false

permissions:
  contents: write                 # save portfolio + dashboard back into the repo
  actions: write                  # start the next job in the chain

concurrency:
  group: paper-bot                # never two copies at once; extra starts just wait
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Trade every 30 minutes for ~5.5 hours
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          git config user.name "paper-bot"
          git config user.email "paper-bot@users.noreply.github.com"

          ARGS=""
          if [ "${{ inputs.reset }}" = "true" ]; then ARGS="$ARGS --reset"; fi
          case "${{ inputs.extra }}" in
            summary) ARGS="$ARGS --summary" ;;
            gems)    ARGS="$ARGS --gems" ;;
            both)    ARGS="$ARGS --summary --gems" ;;
          esac

          save() {
            for d in state reports outbox docs; do if [ -e "$d" ]; then git add -A "$d"; fi; done
            git diff --cached --quiet && return 0
            git commit -q -m "bot run $(date -u +'%Y-%m-%d %H:%M') UTC"
            for i in 1 2 3; do git pull --rebase -q -X ours && git push -q && return 0; sleep 5; done
            echo "push failed, will retry next round"
          }

          START=$(date +%s)
          while true; do
            git pull --rebase -q || true          # pick up any settings you changed
            python run.py $ARGS || echo "run failed, continuing"
            ARGS=""                                # reset/extra reports only on the first round
            save
            ELAPSED=$(( $(date +%s) - START ))
            if [ $ELAPSED -gt 19200 ]; then break; fi   # 5h20m, leave time to hand over
            NOW=$(date +%s); SLEEP=$(( 1800 - NOW % 1800 + 30 ))   # wake at :00/:30 (+30s)
            echo "sleeping ${SLEEP}s until the next half hour"
            sleep $SLEEP
          done

      - name: Start the next job in the chain
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run bot.yml --ref main -R ${{ github.repository }}
